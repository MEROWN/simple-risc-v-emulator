name: CI tests

on:
  pull_request:

  push:
    branches:
      - main

  workflow_dispatch:
    # This is to allow running the workflow manually on github.com


jobs:
  RunTests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Install project dependencies and configure
        run: cmake -B ./build/ -D BUILD_TESTING=ON -D CMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compile
        run: cmake --build ./build/

      - name: Run tests
        run: ./build/tests
